webdriver {
  driver = chrome
  autodownload = true

  capabilities {
    "goog:chromeOptions" {
      args = [
        "--start-maximized",
        "--disable-notifications",
        "--disable-popup-blocking",
        "--ignore-certificate-errors"
      ]
    }
  }
}

headless.mode = false

serenity {
  take.screenshots = FOR_EACH_ACTION
  screenshots.embedded = true
  report.show.step.details = true
  logging = verbose
}

